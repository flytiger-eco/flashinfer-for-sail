name: FlashInfer CUDAFY temporary wheel upload

on:
  workflow_call:
    inputs:
      branch:
        description: '源码分支；按 version.txt 匹配官方 tag 的 CUDA 配置'
        type: string
        required: true
    outputs:
      upload_url:
        description: 'Temporary download directory containing the pure JIT wheel'
        value: ${{ jobs.upload.outputs.upload_url }}
    secrets:
      RELEASE_USERNAME:
        required: true
      RELEASE_TOKEN:
        required: true
      TEMPLATE_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      branch:
        description: '源码分支；按 version.txt 匹配官方 tag 的 CUDA 配置'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cudafy-flashinfer-upload-tmp-${{ inputs.branch }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CUDAFY and package pure JIT wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REPO: t-head/flashinfer-for-sail
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      repo: ${{ steps.package.outputs.repo }}
      commit: ${{ steps.package.outputs.commit }}
      branch: ${{ steps.package.outputs.branch }}
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - name: Checkout conversion tools
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test CUDA configuration restoration
        run: python3 -m unittest discover -s scripts/tests -p 'test_cudafy_flashinfer.py' -v

      - name: Resolve source branch
        id: source
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          ref="refs/heads/$SOURCE_BRANCH"
          git check-ref-format "$ref"
          result=$(git ls-remote --exit-code --refs "https://github.com/$SOURCE_REPO.git" "$ref")
          read -r commit resolved_ref <<< "$result"
          [[ "$commit" =~ ^[0-9a-f]{40}$ && "$resolved_ref" == "$ref" ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          printf 'Source: %s %s (%s)\n' "$SOURCE_REPO" "$SOURCE_BRANCH" "$commit" >> "$GITHUB_STEP_SUMMARY"

      - name: Package and verify pure JIT wheel
        id: package
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
            set -euo pipefail
            commit="$SOURCE_COMMIT"
            git init "$RUNNER_TEMP/flashinfer-target"
            cd "$RUNNER_TEMP/flashinfer-target"
            git fetch --depth 1 "https://github.com/$SOURCE_REPO.git" "$commit"
            git checkout --detach "$commit"
            [[ "$(git rev-parse HEAD)" == "$commit" ]]
            # 按实际 checkout 的 commit 匹配轻量和附注 tag，不依赖浅克隆中的本地 tag。
            tags=$(git ls-remote --tags "https://github.com/$SOURCE_REPO.git" \
              | awk -v commit="$commit" '$1 == commit { sub(/^refs\/tags\//, "", $2); sub(/\^\{\}$/, "", $2); print $2 }' \
              | sort -u | paste -sd ',' -)
            printf 'repo=%s\n' "$SOURCE_REPO" >> "$GITHUB_OUTPUT"
            printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
            # 仅记录实际构建 checkout 的分支；detached HEAD 时为空，不使用输入或默认值。
            printf 'branch=%s\n' "$(git symbolic-ref --quiet --short HEAD || true)" >> "$GITHUB_OUTPUT"
            printf 'tag=%s\n' "$tags" >> "$GITHUB_OUTPUT"
            python3 "$GITHUB_WORKSPACE/scripts/cudafy_flashinfer.py" "$PWD"

            python3 -m pip install build wheel twine
            # 构建依赖取自刚还原的官方 tag，不固定 TVM-FFI 等依赖版本。
            python3 - <<'PY'
            import subprocess
            import sys
            import tomllib
            from pathlib import Path

            project = tomllib.loads(Path("pyproject.toml").read_text())
            subprocess.run(
                [sys.executable, "-m", "pip", "install", *project["build-system"]["requires"]],
                check=True,
            )
            PY
            # 禁止原生 EP 编译和额外 pip 安装；只打包纯 JIT 源码。
            FLASHINFER_BUILD_NO_PIP=1 BUILD_NVEP=0 BUILD_NIXL_EP=0 BUILD_NCCL_EP=0 \
              python3 -m build --no-isolation --skip-dependency-check --wheel \
                --outdir "$RUNNER_TEMP/flashinfer-wheels" \
                --config-setting="--build-option=--build-number=1cudafy${commit:0:12}"
            shopt -s nullglob
            wheels=("$RUNNER_TEMP/flashinfer-wheels/"*.whl)
            if [[ "${#wheels[@]}" -ne 1 ]]; then
              printf 'Expected exactly one wheel, found %s\n' "${#wheels[@]}" >&2
              exit 1
            fi
            wheel="${wheels[0]}"
            python3 -m twine check "$wheel"
            python3 - "$wheel" "$commit" <<'PY'
            import sys
            import tomllib
            from email.parser import BytesParser
            from pathlib import Path, PurePosixPath
            from zipfile import ZipFile

            from packaging.utils import canonicalize_name, parse_wheel_filename
            from packaging.version import Version

            wheel, commit = sys.argv[1:]
            project = tomllib.loads(Path("pyproject.toml").read_text())
            expected_name = canonicalize_name(project["project"]["name"])
            expected_version = Version(Path("version.txt").read_text().strip())
            name, version, build_tag, tags = parse_wheel_filename(Path(wheel).name)
            if name != expected_name or version != expected_version:
                raise SystemExit(f"Wheel identity mismatch: {name} {version}")
            if build_tag != (1, f"cudafy{commit[:12]}"):
                raise SystemExit(f"Wheel build tag mismatch: {build_tag}")
            if any(tag.abi != "none" or tag.platform != "any" for tag in tags):
                raise SystemExit(f"Wheel is not platform-independent: {tags}")
            with ZipFile(wheel) as archive:
                names = set(archive.namelist())
                metadata_files = [name for name in names if name.endswith(".dist-info/METADATA")]
                if len(metadata_files) != 1:
                    raise SystemExit("Expected exactly one wheel METADATA file")
                metadata = BytesParser().parsebytes(archive.read(metadata_files[0]))
                if (
                    canonicalize_name(metadata["Name"]) != expected_name
                    or Version(metadata["Version"]) != expected_version
                ):
                    raise SystemExit("Wheel metadata does not match the source project")
                required = {
                    "flashinfer/data/cutlass/include/cutlass/cutlass.h",
                    "flashinfer/data/csrc/sampling.cu",
                    "flashinfer/data/include/flashinfer/attention/prefill.cuh",
                }
                if missing := required - names:
                    raise SystemExit(f"Missing wheel contents: {sorted(missing)}")
                if any(name.startswith("flashinfer/data/sailify/") for name in names):
                    raise SystemExit("CUDA wheel unexpectedly contains Sailify data")
                compiled = [
                    name for name in sorted(names)
                    if name.startswith("flashinfer/data/aot/")
                    or set(PurePosixPath(name).suffixes) & {
                        ".a", ".cubin", ".dll", ".dylib", ".fatbin", ".o", ".pyd", ".so",
                    }
                ]
                if compiled:
                    raise SystemExit(f"Pure JIT wheel contains compiled files or AOT data: {compiled[:10]}")
                if commit.encode() not in archive.read("flashinfer/_build_meta.py"):
                    raise SystemExit("Wheel build metadata is missing the source commit")
            PY

      - name: Set artifact name
        id: artifact
        run: |
          suffix=$(python3 -c 'from uuid import uuid4; print(uuid4().hex)')
          echo "name=flashinfer-cudafy-wheel-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$suffix" >> "$GITHUB_OUTPUT"

      - name: Save wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/flashinfer-wheels/*.whl
          if-no-files-found: error
          compression-level: 0

  upload:
    name: Upload to temporary wheel directory
    needs: build
    uses: flytiger-eco/shared-workflows/.github/workflows/push-tmp-wheel.yml@main
    with:
      artifact_name: ${{ needs.build.outputs.artifact_name }}
      repo: ${{ needs.build.outputs.repo }}
      commit: ${{ needs.build.outputs.commit }}
      branch: ${{ needs.build.outputs.branch }}
      tag: ${{ needs.build.outputs.tag }}
      template_ref: main
    secrets:
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
      template_token: ${{ secrets.TEMPLATE_TOKEN }}

  result:
    name: Show temporary download URL
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write download URL to Summary
        env:
          UPLOAD_URL: ${{ needs.upload.outputs.upload_url }}
        run: |
          printf 'Temporary wheel directory: %s\n' "$UPLOAD_URL" | tee -a "$GITHUB_STEP_SUMMARY"
