name: PPU Ccache Warm

on:
  push:
    branches: [v0.6.12]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docker/**'
      - 'licenses/**'
      - 'benchmarks/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
    inputs:
      cuda_arch_list:
        description: 'Target CUDA arch list (TORCH_CUDA_ARCH_LIST / FLASHINFER_CUDA_ARCH_LIST)'
        type: string
        default: '8.0'

concurrency:
  group: ppu-ccache-warm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/flashinfer-ppu-build:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.13-py312
  CUDA_ARCH_LIST: ${{ github.event.inputs.cuda_arch_list || '8.0' }}
  AOT_MAX_JOBS_MEMORY_GB: '3'
  CCACHE_DIR_HOST: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: '5G'

jobs:
  warm:
    name: PPU Ccache Warm (AOT)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Cleanup
        run: |
          # Stop leftover containers from previous runs to free memory
          docker stop $(docker ps -q) 2>/dev/null || true
          docker rm $(docker ps -aq) 2>/dev/null || true
          # Clean workspace and JIT cache
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          rm -rf ~/.cache/flashinfer_jit || true
          docker image prune -f || true
          docker builder prune -f --filter "until=24h" || true

      - name: Free disk space
        run: |
          AVAIL_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "Available on /: ${AVAIL_GB} GB"
          if [ "${AVAIL_GB:-0}" -lt 60 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /usr/local/share/boost /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
            df -h /
          else
            echo "Enough free space, skipping preinstalled SDK cleanup"
          fi

      - name: Pull Image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "${IMAGE_NAME}" || {
            echo "::error::Failed to pull ${IMAGE_NAME}. If the tag is missing, mirror it first by running the 'PPU Mirror Image' workflow."
            exit 1
          }
          docker images "${IMAGE_NAME}"
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR_HOST }}
          key: ppu-ccache-${{ runner.os }}-arch${{ env.CUDA_ARCH_LIST }}-${{ github.sha }}
          restore-keys: |
            ppu-ccache-${{ runner.os }}-arch${{ env.CUDA_ARCH_LIST }}-

      - name: Show Node Info
        run: |
          echo "===== RUNNER INFO ====="
          echo "runner: ${{ runner.name }} (${{ runner.environment }})"
          echo "run number: ${{ github.run_number }}"
          echo "workspace: ${{ github.workspace }}"
          df --human-readable
          nproc
          free -h
          nvidia-smi 2>/dev/null || echo "no gpu on build node"

      - name: Warm ccache (AOT build)
        run: |
          bash ci/bash.sh "${IMAGE_NAME}" \
            -e TORCH_CUDA_ARCH_LIST "${CUDA_ARCH_LIST}" \
            -e FLASHINFER_CUDA_ARCH_LIST "${CUDA_ARCH_LIST}" \
            -e AOT_MAX_JOBS_MEMORY_GB "${AOT_MAX_JOBS_MEMORY_GB}" \
            -e FLASHINFER_ENABLE_CCACHE 1 \
            -e CCACHE_DIR /workspace/.ccache \
            -e CCACHE_MAXSIZE "${CCACHE_MAXSIZE}" \
            --no-gpu ./scripts/task_ppu_build_wheel.sh

      - name: Normalize ccache permissions
        if: "!cancelled()"
        run: |
          sudo chmod -R a+rX "${CCACHE_DIR_HOST}" 2>/dev/null || true

      - name: Save ccache
        if: "!cancelled()"
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR_HOST }}
          key: ppu-ccache-${{ runner.os }}-arch${{ env.CUDA_ARCH_LIST }}-${{ github.sha }}-${{ github.run_id }}

      - name: Warm Summary
        if: "!cancelled()"
        run: |
          echo "## PPU Ccache Warm" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${IMAGE_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Arch list: \`${CUDA_ARCH_LIST}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Cache key prefix: \`ppu-ccache-${{ runner.os }}-arch${CUDA_ARCH_LIST}-\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "- Status: Cache warmed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Status: Failed" >> $GITHUB_STEP_SUMMARY
          fi
