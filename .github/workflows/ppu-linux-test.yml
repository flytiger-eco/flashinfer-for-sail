name: PPU Linux Test

on:
  pull_request:
    branches: [v0.6.12]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docker/**'
      - 'licenses/**'
      - 'benchmarks/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'PPU Linux Build run ID to download the wheel from'
        required: true
        type: string

concurrency:
  group: ppu-linux-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PPU_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.13-py312
  PPU_SOURCE_DIR: /workspace/source

jobs:
  ppu-test-810e:
    name: PPU Test (810E tests)
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 720
    steps:
      - name: Wait for PPU Linux Build (PR)
        id: waitbuild
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNS_API: https://api.github.com/repos/${{ github.repository }}/actions/workflows/ppu-linux-build.yml/runs
          CANDIDATE_SHAS: ${{ github.event.pull_request.head.sha }} ${{ github.sha }}
          WAIT_TIMEOUT_MINUTES: '360'
          WAIT_INTERVAL_SECONDS: '60'
        run: |
          set -eu
          deadline=$(( $(date +%s) + WAIT_TIMEOUT_MINUTES * 60 ))
          api_get() {
            curl -sfL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1" || true
          }
          echo "Looking for a completed 'PPU Linux Build' run for head_sha in: ${CANDIDATE_SHAS}"
          first=1
          while true; do
            found_pending=0
            for sha in ${CANDIDATE_SHAS}; do
              resp="$(api_get "${RUNS_API}?head_sha=${sha}&per_page=1")"
              run_id="$(printf '%s' "${resp}" | grep -o '"id":[[:space:]]*[0-9]\{1,\}' | head -1 | grep -o '[0-9]\{1,\}' || true)"
              run_status="$(printf '%s' "${resp}" | grep -o '"status":[[:space:]]*"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"/\1/' || true)"
              conclusion="$(printf '%s' "${resp}" | grep -o '"conclusion":[[:space:]]*"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"/\1/' || true)"
              [ -z "${run_id}" ] && continue
              if [ "${run_status}" = "completed" ]; then
                echo "Build run ${run_id} (head_sha=${sha}) completed (conclusion=${conclusion:-none})."
                if [ "${conclusion}" = "success" ]; then
                  echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "::error::PPU Linux Build run ${run_id} did not succeed (conclusion=${conclusion:-none}); nothing to test."
                exit 1
              fi
              found_pending=1
              echo "Build run ${run_id} (head_sha=${sha}) is '${run_status}'; still running."
            done

            # One-time diagnostic: show what the build workflow actually recorded,
            # so a persistent no-match can be debugged from the log alone.
            if [ "${first}" = "1" ]; then
              first=0
              echo "--- debug: 10 most recent 'PPU Linux Build' runs ---"
              dbg="$(api_get "${RUNS_API}?per_page=10")"
              printf '%s' "${dbg}" | grep -o '"head_sha":[[:space:]]*"[^"]*"' | sed 's/.*"\([^"]*\)"$/  head_sha=\1/' | head -10 || true
              printf '%s' "${dbg}" | grep -o '"status":[[:space:]]*"[^"]*"' | sed 's/.*"\([^"]*\)"$/  status=\1/' | head -10 || true
              printf '%s' "${dbg}" | grep -o '"event":[[:space:]]*"[^"]*"' | sed 's/.*"\([^"]*\)"$/  event=\1/' | head -10 || true
              echo "----------------------------------------------------"
            fi

            if [ "${found_pending}" = "0" ]; then
              echo "No matching 'PPU Linux Build' run yet; retrying in ${WAIT_INTERVAL_SECONDS}s..."
            else
              echo "Retrying in ${WAIT_INTERVAL_SECONDS}s..."
            fi

            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::Timed out after ${WAIT_TIMEOUT_MINUTES}m waiting for PPU Linux Build (candidates: ${CANDIDATE_SHAS})."
              exit 1
            fi
            sleep "${WAIT_INTERVAL_SECONDS}"
          done

      - name: Resolve build run (dispatch)
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_RUN_ID: ${{ github.event.inputs.build_run_id }}
        run: |
          set -eu
          if ! [ "${INPUT_RUN_ID}" -gt 0 ] 2>/dev/null; then
            echo "::error::Invalid build_run_id: '${INPUT_RUN_ID}'"
            exit 1
          fi
          echo "run_id=${INPUT_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download wheel from build run
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.waitbuild.outputs.run_id || steps.dispatch.outputs.run_id }}
          name: flashinfer-for-sail-wheel-.*
          name_is_regexp: true
          path: wheelhouse
          if_no_artifact_found: error

      - name: Show downloaded wheel
        run: |
          echo "=== wheelhouse ==="
          find wheelhouse -type f -print

      - name: Run tests on 810E PPU
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=OAM-810E"
          host_volumes: "/nas_aisw:/nas_aisw,/wl_nas:/mnt/wl_nas"
          image: ${{ env.PPU_IMAGE }}
          source_dir: ${{ env.PPU_SOURCE_DIR }}
          artifact_paths: wheelhouse
          namespace: ppu-sched
          timeout_minutes: 300
          command: |
            # POSIX-safe: the pod image's /bin/sh may be dash, so avoid
            # `set -o pipefail` (same reason as the runner-side steps above).
            # The test body lives in scripts/task_ppu_run_tests.sh (bash, so it
            # can use an array for the pytest --deselect list); invoke it via
            # `bash` since the image ships bash even when /bin/sh is dash.
            set -eu
            bash "${PPU_SOURCE_DIR:-/workspace/source}/scripts/task_ppu_run_tests.sh"

      - name: Test Summary
        if: "!cancelled()"
        run: |
          {
            echo "## PPU Linux Test"
            echo "- Board: \`OAM-810E\` (1 PPU)"
            echo "- Image: \`${PPU_IMAGE}\`"
            echo "- Build run: \`${{ steps.waitbuild.outputs.run_id || steps.dispatch.outputs.run_id }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            if [ "${{ job.status }}" = "success" ]; then
              echo "- Status: Passed"
            else
              echo "- Status: ${{ job.status }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
